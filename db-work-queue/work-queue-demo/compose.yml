services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    platform: linux/amd64
    cap_add: [IPC_LOCK, IPC_OWNER]
    ports: ["127.0.0.1:50000:50000"]
    environment:
      LICENSE: accept
      DBNAME: WORKQ
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:?Create the demo .env first}
      AUTOCONFIG: "false"
      ARCHIVE_LOGS: "false"
      TZ: UTC
    volumes:
      - db2-data:/database
volumes:
  db2-data:
